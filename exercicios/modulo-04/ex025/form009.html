<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Output dinâmico com o elemento range</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="inum">Número: </label><br>
            <input type="range" name="num" id="inum" max="10" value="5" oninput="iout.innerHTML = Number(inum.value)">
            <output id="iout">5</output>
        </p>
    </form>
</body>
</html>
