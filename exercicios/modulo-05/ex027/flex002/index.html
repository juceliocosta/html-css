<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        body {
            width: 50%;
            margin: auto;
            font-family: 'Courier New', Courier, monospace;
        }
        div.conteiner {
            background-color: lightsalmon;
            display: flex;
            margin-bottom: 40px;
        }
        .row-reverse {
            flex-direction: row-reverse;
        }
        .column {
            flex-direction: column;
        }

        .column-reverse {
            flex-direction: column-reverse;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
            width: 20px;
        }

    </style>
</head>
<body>
    <h1>No elemento Pai</h1>
    <p>display: flex</p>
    <p>flex-direction: row</p>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
    </div>

    <p>flex-direction: row-reverce</p>
    <div class="conteiner row-reverse">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
    </div>

    <p>flex-direction: column</p>
    <div class="conteiner column">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
    </div>

    <p>flex-direction: column-reverse</p>
    <div class="conteiner column-reverse">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
    </div>
</body>
</html>
