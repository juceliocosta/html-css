<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        div.container {
            border: 5px solid blue;
            height: 250px;
            display: grid;
            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;
            gap: 5px;
        }

        div.item {
            border: 3px solid red;
            padding: 5px
        }

        div.cfg-css {
            background-color: azure;
            padding: 10px;
            font-family: monospace;
        }

        div.contents {
            border: 3px solid blue;
        }

        div.items {
            border: 3px solid red;
        }
    </style>
</head>

<body>
    <div class="cfg-css">
        <div class="contents">
            display: grid;<br>
            grid-template-columns: auto auto auto;<br>
            grid-template-rows: auto auto auto;<br>
            gap: 5px;<br>

            &#8597 align-content:<select name="align-content" id="align-content">
                <option value="stretch" selected>stretch</option>
                <option value="start">start</option>
                <option value="center">center</option>
                <option value="end">end</option>
                <option value="space-between">space-between</option>
                <option value="space-around">space-around</option>
                <option value="space-evenly">space-evenly</option>
            </select>;<br>
            &#8596 justify-content:<select name="justify-content" id="justify-content">
                <option value="stretch" selected>stretch</option>
                <option value="start">start</option>
                <option value="center">center</option>
                <option value="end">end</option>
                <option value="space-between">space-between</option>
                <option value="space-around">space-around</option>
                <option value="space-evenly">space-evenly</option>
            </select>;<br>
        </div>
        <div class="items">&#8597 align-items:<select name="align-items" id="align-items">
                <option value="stretch" selected>stretch</option>
                <option value="start">start</option>
                <option value="center">center</option>
                <option value="end">end</option>
            </select>;<br>
            &#8596 justify-items:<select name="justify-items" id="justify-items">
                <option value="stretch" selected>stretch</option>
                <option value="start">start</option>
                <option value="center">center</option>
                <option value="end">end</option>
            </select>;
        </div>
    </div>

    <div class="container" id="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
    </div>
    <script>
        container = document.getElementById("container");
        alignItems = document.getElementById("align-items");
        justifyItems = document.getElementById("justify-items");
        alignContent = document.getElementById("align-content");
        justifyContent = document.getElementById("justify-content");

        document.addEventListener("input", () => {
            container.style.alignItems = alignItems.value;
        });

        document.addEventListener("input", () => {
            container.style.justifyItems = justifyItems.value;
        });

        document.addEventListener("input", () => {
            container.style.alignContent = alignContent.value;
        });

        document.addEventListener("input", () => {
            container.style.justifyContent = justifyContent.value;
        });
    </script>
</body>

</html>
